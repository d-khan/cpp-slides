name: Deploy Slidev to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ==========================================
      # Introduction
      # ==========================================

      - name: Install introduction dependencies
        working-directory: introduction
        run: npm ci

      - name: Build introduction
        working-directory: introduction
        run: npm run build -- --base /cpp-slides/introduction/

      # ==========================================
      # Input / Output
      # ==========================================

      - name: Install input-output dependencies
        working-directory: input-output
        run: npm ci

      - name: Build input-output
        working-directory: input-output
        run: npm run build -- --base /cpp-slides/input-output/

      # ==========================================
      # Decision Statements
      # ==========================================

      - name: Install decision dependencies
        working-directory: decision
        run: npm ci

      - name: Build decision
        working-directory: decision
        run: npm run build -- --base /cpp-slides/decision/

      # ==========================================
      # Loops
      # ==========================================

      - name: Install loops dependencies
        working-directory: loops
        run: npm ci

      - name: Build loops
        working-directory: loops
        run: npm run build -- --base /cpp-slides/loops/

      # ==========================================
      # Functions
      # ==========================================

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build -- --base /cpp-slides/functions/

      # ==========================================
      # Prepare GitHub Pages
      # ==========================================

      - name: Prepare site
        run: |
          mkdir -p site/introduction
          mkdir -p site/input-output
          mkdir -p site/decision
          mkdir -p site/loops
          mkdir -p site/functions

          cp -R introduction/dist/* site/introduction/
          cp -R input-output/dist/* site/input-output/
          cp -R decision/dist/* site/decision/
          cp -R loops/dist/* site/loops/
          cp -R functions/dist/* site/functions/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4